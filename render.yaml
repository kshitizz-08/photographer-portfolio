# Render Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ── 1. Backend Web Service (Node.js / Express API) ─────────────────────────
  - type: web
    name: photographer-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Enter your MongoDB Atlas connection string in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit random string
      - key: ADMIN_COOKIE_NAME
        value: photographer_admin_session
      - key: ALLOWED_ORIGINS
        sync: false # Set to your frontend URL, e.g. https://photographer-frontend.onrender.com

  # ── 2. Frontend Static Site (React / Vite Single Page App) ──────────────────
  - type: static
    name: photographer-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA Client-Side Routing: redirect all browser page routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend API URL, e.g. https://photographer-backend.onrender.com/api
